name: bharatbot

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bharatbot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bharatbot
      - POSTGRES_PASSWORD=bharatbot
      - POSTGRES_DB=bharatbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bharatbot-network

  backend:
    build: ./backend
    container_name: bharatbot-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://bharatbot:bharatbot@postgres:5432/bharatbot
      - FRONTEND_ORIGIN=http://localhost:${FRONTEND_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${BACKEND_PORT:-8000}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bharatbot-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    container_name: bharatbot-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bharatbot-network

networks:
  bharatbot-network:
    driver: bridge

volumes:
  pgdata:
